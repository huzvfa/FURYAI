# docker-compose.yml
version: '3.8'
services:
  api:
    build: ./api
    ports:
      - "5000:5000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - db
  client:
    build: ./client
    ports:
      - "3000:3000"
  db:
    image: mongo:latest
    ports:
      - "27017:27017"
